name: Update RPG Character Sheet

on:
  schedule:
    - cron: "0 */12 * * *"
  push:
    paths:
      - "scripts/generate_rpg.py"
      - "assets/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-rpg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-rpg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install requests

      - name: Generate RPG Profile SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_rpg.py

      - name: Commit and push updated RPG SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rpg-profile.svg
          if git diff --cached --quiet; then
            echo "No changes to rpg-profile.svg"
          else
            git commit -m "chore: update rpg-profile.svg"
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
            git push
          fi
